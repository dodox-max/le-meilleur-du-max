# Robot du site « Le meilleur du Max by DDX »
# - toutes les 30 minutes : regarde si la SNCF a publié de nouvelles données
# - si oui : met à jour le dossier data/ et republie le site
# - à chaque modification du site : republie le site
name: Mise à jour des trains et du site

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forcer le téléchargement des données même sans nouveauté'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  donnees:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer les données SNCF
        if: github.event_name != 'push' || hashFiles('data/meta.json') == ''
        run: node scripts/update-data.mjs ${{ inputs.force && '--force' || '' }}

      - name: Tester la recherche de correspondances sur les vraies données
        if: hashFiles('data/meta.json') != ''
        run: node tests/test-routing.mjs || echo "::warning::Un test de correspondance a échoué, voir le journal"

      - name: Enregistrer les nouvelles données
        id: commit
        run: |
          git config user.name "robot-max"
          git config user.email "robot-max@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucune nouvelle donnée."
          else
            git commit -m "Données SNCF mises à jour"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  publier:
    needs: donnees
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.donnees.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
